    reversibility: n_a
    lead_time_days: 0
    blast_radius: none
    approval_required: false
    budget_cap: 0
policies:
  row_level:
    region_scope:
      description: A principal sees only regions in their grant.
      predicate: region IN :allowed_regions
  column_level:
    restricted_cost:
      description: Unit cost, landed cost and absolute margin are restricted.
      protected_columns:
      - finance_erp.sku_week_cost.unit_cost
      - finance_erp.sku_week_cost.landed_cost
      - gross_margin_pct
      allowed_roles:
      - category_director
      - cfo
      - analyst
      on_deny: withhold_and_disclose_count
  domain_level:
    pii_shield:
      description: Raw customer text and identifiers never leave the extraction boundary.
      applies_to_corpora:
      - support_tickets
      - supplier_emails
      rule: extract typed claims only; persist entity keys and character spans, never raw PII text
      allowed_roles_for_raw: []
  audit:
    log_events:
    - query_issued
    - policy_denied
    - evidence_admitted
    - evidence_withheld
    - llm_call
    - verdict_emitted
    - action_recommended
    - feedback_received
    - outcome_measured
    immutable: true
