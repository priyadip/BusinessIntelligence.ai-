    channel: Workbench
    decision_rights:
      can_approve_upto: 200000
      requires_approval_from: category_director
decision_policy:
  multiplicity:
    default_method: benjamini_hochberg
    assumption: Monitors over the same business are positively dependent (PRDS), under which Benjamini-Hochberg
      controls FDR. Benjamini-Yekutieli is available and makes no dependence assumption; it costs a factor of H_m
      in power and is used for adversarial review.
    alternative_method: benjamini_yekutieli
    materiality_weighting: Genovese-Roeder-Wasserman p-value weights, normalised to mean one. Materiality never
      filters the family before the procedure runs.
  act_threshold_posterior: 0.7
  min_rung_to_claim_cause: R3
  min_posterior_mass_ev_positive: 0.8
  abstain_types:
  - collinear_causes
  - underpowered
  - missing_evidence
  - contradictory_evidence
  - out_of_library
  - stale_source
  - sparse_history
  sparse_history:
    below_min_history: pool_hierarchical_prior
    pooled_from: comparable launches in same category family
    widen_interval_factor: 1.9
    causal_claims_allowed: false
  proof_ladder:
    R0:
      name: Arithmetic
      verb: accounts for
      allows_causal_language: false
    R1:
      name: Association
      verb: is associated with
      allows_causal_language: false
    R2:
      name: Temporal+Mechanism
      verb: is consistent with
      allows_causal_language: false
    R3:
      name: Quasi-experimental
      verb: the evidence suggests caused
      allows_causal_language: true
    R4:
      name: Measured
      verb: caused
      allows_causal_language: true
