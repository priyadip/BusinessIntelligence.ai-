  ops_manager:
    label: Regional Fulfilment Manager
    entitlements:
      regions:
      - WEST
      columns_denied:
      - restricted_cost
      corpora_raw: []
    kpi_focus:
    - fulfilment_ontime_pct
    - conversion_rate
    narrative:
      depth: brief
      tone: operational
      max_words: 130
      lead_with: action
    action_scope:
    - carrier_routing
    - checkout_config_flag
    channel: Teams alert
    decision_rights:
