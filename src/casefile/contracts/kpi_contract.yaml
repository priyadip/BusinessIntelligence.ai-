      requires_approval_from: none
  category_director:
    label: Category Director (P&L owner)
    entitlements:
      regions:
      - WEST
      - NORTH
      - SOUTH
      - EAST
      columns_denied: []
      corpora_raw: []
    kpi_focus:
    - net_revenue
    - avg_order_value
    - gross_margin_pct
    - conversion_rate
    narrative:
      depth: standard
      tone: commercial
      max_words: 230
      lead_with: driver_decomposition
    action_scope:
    - price_change
    - promo_depth
    - merchandising_mix
    - paid_media_spend
    channel: Email digest
    decision_rights:
      can_approve_upto: 12000000
      requires_approval_from: cfo
  cfo:
    label: Chief Financial Officer
    entitlements:
      regions:
      - WEST
      - NORTH
      - SOUTH
      - EAST
      columns_denied: []
      corpora_raw: []
    kpi_focus:
    - net_revenue
    - gross_margin_pct
    narrative:
      depth: executive
      tone: financial
      max_words: 150
      lead_with: exposure_and_decision
    action_scope:
    - price_change
    - promo_depth
    - paid_media_spend
    - inventory_replenish
    channel: Executive brief
    decision_rights:
      can_approve_upto: 100000000
      requires_approval_from: none
  analyst:
    label: Insight Analyst
    entitlements:
      regions:
      - WEST
      - NORTH
      - SOUTH
      - EAST
      columns_denied: []
      corpora_raw: []
    kpi_focus:
